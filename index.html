<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bizim Gökyüzümüz</title>
<style>
:root{--bg:#050816;--fg:#f3ecdc;--soft:#b9b4c8;--gold:#f2cf8b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
body{padding:env(safe-area-inset-top,0px) 18px env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at top,#141a3d 0%,#050816 60%) no-repeat;min-height:100%}
main{max-width:560px;margin:0 auto;padding:34px 0 40px;text-align:center}
h1{font-weight:normal;font-size:2rem;margin:0 0 4px;letter-spacing:.04em}
h1 span{color:var(--gold)}
.sub{color:var(--soft);font-size:.95rem;margin:0 0 22px}
canvas{width:100%;max-width:520px;aspect-ratio:1;display:block;margin:0 auto;border-radius:50%;box-shadow:0 0 60px rgba(120,140,255,.25)}
.ctl{margin:20px auto 4px;max-width:420px;color:var(--soft);font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--gold)}
#info{color:var(--soft);font-size:.85rem;margin:6px 0 0}
.letter{margin:34px 0 0;line-height:1.85;font-size:1.05rem;text-align:left}
.letter p{margin:0 0 1em}
.sign{text-align:right;color:var(--gold);font-style:italic}
.foot{color:#7f7b94;font-size:.78rem;margin-top:26px}

#gate{max-width:360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#gate h2{font-weight:normal;font-size:1.5rem;margin:0 0 6px}
#gate p{color:var(--soft);font-size:.9rem;margin:0 0 20px}
#pw{width:160px;text-align:center;font-size:1.8rem;letter-spacing:.35em;padding:10px;border-radius:12px;border:1px solid #3a4075;background:#0b1233;color:var(--fg);font-family:inherit}
#pw:focus{outline:2px solid var(--gold)}
#err{color:#e9a0a0;font-size:.85rem;height:1.2em;margin-top:12px}
</style></head>
