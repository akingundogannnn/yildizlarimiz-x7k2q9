<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bizim Gökyüzümüz</title>
<style>
:root{--bg:#050816;--fg:#f3ecdc;--soft:#b9b4c8;--gold:#f2cf8b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
body{padding:env(safe-area-inset-top,0px) 18px env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at top,#141a3d 0%,#050816 60%) no-repeat;min-height:100%}
main{max-width:560px;margin:0 auto;padding:34px 0 40px;text-align:center}
h1{font-weight:normal;font-size:2rem;margin:0 0 4px;letter-spacing:.04em}
h1 span{color:var(--gold)}
.sub{color:var(--soft);font-size:.95rem;margin:0 0 22px}
canvas{width:100%;max-width:520px;aspect-ratio:1;display:block;margin:0 auto;border-radius:50%;box-shadow:0 0 60px rgba(120,140,255,.25)}
.ctl{margin:20px auto 4px;max-width:420px;color:var(--soft);font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--gold)}
#info{color:var(--soft);font-size:.85rem;margin:6px 0 0}
.letter{margin:34px 0 0;line-height:1.85;font-size:1.05rem;text-align:left}
.letter p{margin:0 0 1em}
.sign{text-align:right;color:var(--gold);font-style:italic}
.pb{margin-top:14px;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:10px 22px;font-family:inherit;font-size:1rem;cursor:pointer}
.tap{color:#8a86a0;font-size:.8rem;margin:8px 0 0}
.note{min-height:74px;margin:12px auto 0;max-width:420px;padding:14px 18px;border:1px solid rgba(242,207,139,.35);border-radius:14px;background:rgba(255,255,255,.04);font-style:italic;line-height:1.5;opacity:0;transition:opacity .4s}
.note.on{opacity:1}
.note b{display:block;color:var(--gold);font-style:normal;font-size:.85rem;letter-spacing:.12em;margin-bottom:4px}
.days{margin:34px 0 0;text-align:center}
.days .dsub{color:var(--soft);font-size:.95rem;font-style:italic}
.days .dn{font-size:3.4rem;color:var(--gold);line-height:1.1;margin-top:4px}
.days .dn small{font-size:1.2rem;color:var(--soft)}
.wish{margin:26px 0 0;text-align:center}
.wm{color:var(--soft);font-style:italic;font-size:.95rem;margin:12px 0 0;min-height:1.5em}
.gt{color:var(--gold);font-style:italic;font-size:1.15rem;text-align:center;margin:40px 0 0}
.gal{display:flex;gap:16px;justify-content:center;margin:16px 0 0}
.ph{width:47%;max-width:230px;background:#fffaf3;padding:9px 9px 30px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);color:#5a5470;cursor:pointer;transform:rotate(-2deg)}
.ph:nth-child(2){transform:rotate(2deg)}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:3px}
.ph span{display:block;font-style:italic;font-size:.85rem;margin-top:7px;text-align:center}
.lb{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(3,5,18,.94);z-index:100;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lb img{max-width:94vw;max-height:90vh;border-radius:10px}
.mem{color:var(--gold);font-style:italic;text-align:center;font-size:1.05rem;margin:22px 0 0;letter-spacing:.04em}
.foot{color:#7f7b94;font-size:.78rem;margin-top:26px}

#gate{max-width:360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#gate h2{font-weight:normal;font-size:1.5rem;margin:0 0 6px}
#gate p{color:var(--soft);font-size:.9rem;margin:0 0 20px}
#pw{width:160px;text-align:center;font-size:1.8rem;letter-spacing:.35em;padding:10px;border-radius:12px;border:1px solid #3a4075;background:#0b1233;color:var(--fg);font-family:inherit}
#pw:focus{outline:2px solid var(--gold)}
#err{color:#e9a0a0;font-size:.85rem;height:1.2em;margin-top:12px}
</style></head>
<body>
<div id="gate"><h2>&#10024; Bizim Gökyüzümüz</h2><p>Tanıştığımız günün gün ve ayı (GGAA)</p>
